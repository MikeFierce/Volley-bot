<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Питерский Волейбол — калькулятор турнира</title><style>*{box-sizing:border-box}body{margin:0;background:#101b35;color:white;font:16px system-ui}main{max-width:720px;margin:auto;padding:20px}h1{color:#ffda32;font-size:28px}section{background:#202e4b;border-radius:16px;padding:18px;margin:16px 0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-size:14px}input,select,button{width:100%;padding:12px;margin-top:6px;border:0;border-radius:8px;font:inherit}button{background:#ffda32;color:#101b35;font-weight:bold}p{display:flex;justify-content:space-between;gap:12px}strong{white-space:nowrap}small{color:#c5d0e4}#profit{font-size:25px}</style><main><small>ПИТЕРСКИЙ ВОЛЕЙБОЛ</small><h1>PV MONEY CUP</h1>Калькулятор экономики турнира<section><div class="fields"><label>Команды<input id="teams" type="number" min="1" step="1" value="8"></label><label>Игроков в команде<input id="players" type="number" min="1" step="1" value="6"></label><label>Взнос, ₽<input id="fee" type="number" min="0" value="2500"></label><label>Тип взноса<select id="type"><option value="player">С игрока</option><option value="team">С команды</option></select></label><label>Площадки<input id="courts" type="number" min="1" step="1" value="2"></label><label>Часы аренды<input id="hours" type="number" min="0" step=".5" value="6"></label><label>Аренда за час / площадку, ₽<input id="rent" type="number" min="0" value="5000"></label><label>Прочие расходы, ₽<input id="other" type="number" min="0" value="5000"></label><label>Призовой фонд, ₽<input id="prize" type="number" min="0" value="30000"></label><label>Распределение<select id="mode"><option value="one">Только победитель</option><option value="three">Три места (60/30/10)</option></select></label></div></section><section id="results" aria-live="polite"></section><button id="share">Поделиться расчётом</button><small>Расчёт до налогов. Аренда и расходы — вводимые предположения.</small></main><script>const $=id=>document.getElementById(id),ids=['teams','players','fee','type','courts','hours','rent','other','prize','mode'],q=new URLSearchParams(location.search);for(const id of ids){if(q.has(id))$(id).value=q.get(id)}const n=id=>Math.max(0,Number($(id).value)||0),f=x=>Math.round(x).toLocaleString('ru-RU')+' ₽';function calc(){const t=Math.max(1,Math.floor(n('teams'))),p=Math.max(1,Math.floor(n('players'))),units=$('type').value==='team'?t:t*p,fee=n('fee'),income=units*fee,rental=n('courts')*n('hours')*n('rent'),prize=n('prize'),cost=rental+n('other')+prize,profit=income-cost,three=$('mode').value==='three',first=three?Math.round(prize*.6):prize,second=three?Math.round(prize*.3):0;const rows=[['Участников',t*p],['Выручка',f(income)],['Аренда',f(rental)],['Прочие расходы',f(n('other'))],['Призовой фонд',f(prize)],['Прибыль до налогов',f(profit)],['🥇 Первое место',f(first)],['🥈 Второе место',f(second)],['🥉 Третье место',f(prize-first-second)],['Взнос для безубыточности',f(Math.ceil(cost/units))],['Минимум команд для окупаемости',fee>0?Math.ceil(cost/(fee*($('type').value==='team'?1:p))):'—']];$('results').innerHTML=rows.map(([k,v],i)=>'<p>'+k+'<strong '+(i===5?'id="profit" style="color:'+(profit>=0?'#8ce6a5':'#ff9a9a')+'"':'')+'>'+v+'</strong></p>').join('')}for(const id of ids)$(id).addEventListener('input',calc);calc();$('share').onclick=async()=>{const u=new URL(location.href);for(const id of ids)u.searchParams.set(id,$(id).value);try{if(navigator.share){await navigator.share({title:document.title,url:u.href});return}await navigator.clipboard.writeText(u.href);$('share').textContent='Ссылка скопирована'}catch(e){if(e.name!=='AbortError')prompt('Скопируйте ссылку',u.href)}};</script></html>
