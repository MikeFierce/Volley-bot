function teamEditor(t){return `<div class="between mb8"><h2>Заявка команды</h2><button class="btn" data-cancel-team>Отмена</button></div><section class="card"><div class="grid2"><label><span class="label">Название команды</span><input class="field" data-tfield="name" placeholder="Например: Рубеж" value="${esc(t.name)}"></label><label><span class="label">Система игры</span><select class="field" data-tfield="system"><option value="5-1" ${t.system==='5-1'?'selected':''}>5–1 · один связующий</option><option value="4-2" ${t.system==='4-2'?'selected':''}>4–2 · два связующих</option><option value="6-2" ${t.system==='6-2'?'selected':''}>6–2 · два связующих</option></select></label></div><div class="grid2 mt12"><div><span class="label">Цвет полевых игроков</span><div class="flex"><input type="color" class="colorpick" data-color="field" value="${esc(t.colors.field)}"><span class="small muted">На схеме площадки</span></div></div><div><span class="label">Отдельный цвет либеро</span><div class="flex"><input type="color" class="colorpick" data-color="libero" value="${esc(t.colors.libero)}"><span class="small muted">Связующий дополнительно обведён бирюзовым</span></div></div></div><div class="divider"></div><div class="grid2"><label><span class="label">Предпочтительный либеро на приёме</span><select class="field slim" data-tfield="liberoPreferredReceiving"><option value="">Автовыбор</option>${t.players.filter(p=>p.role==='Либеро').map(p=>`<option value="${p.id}" ${t.liberoPreferredReceiving===p.id?'selected':''}>№${esc(p.number)} ${esc(p.name)}</option>`).join('')}</select></label><label><span class="label">Предпочтительный либеро на своей подаче</span><select class="field slim" data-tfield="liberoPreferredServing"><option value="">Автовыбор</option>${t.players.filter(p=>p.role==='Либеро').map(p=>`<option value="${p.id}" ${t.liberoPreferredServing===p.id?'selected':''}>№${esc(p.number)} ${esc(p.name)}</option>`).join('')}</select></label></div><p class="small muted mt8">Выбор двух либеро применяется с ограничениями правил замен, а не автоматически после каждого розыгрыша.</p><div class="divider"></div><div class="between mb8"><h3>Полная заявка · ${t.players.length}</h3><button class="btn tiny" data-add-team-player>+ Игрок / запасной</button></div><div class="rosterRows">${t.players.map((p,i)=>`<div class="rosterRow"><input class="field slim" aria-label="Номер" data-player-field="number" data-player-id="${p.id}" value="${esc(p.number)}"><input class="field slim" aria-label="Фамилия имя" data-player-field="name" data-player-id="${p.id}" placeholder="Фамилия и имя" value="${esc(p.name)}"><select class="field slim" aria-label="Амплуа" data-player-field="role" data-player-id="${p.id}">${ROLES.map(r=>`<option ${p.role===r?'selected':''}>${r}</option>`).join('')}</select><button class="btn tiny danger" data-remove-team-player="${p.id}" title="Убрать">×</button></div>`).join('')}</div><div class="flex mt18"><button class="btn primary" data-save-team>Сохранить команду</button><span class="small muted">Минимум шесть полевых игроков. Запасных и либеро можно добавить.</span></div></section>`}
function ensureSetup(){if(!ui.setup.a||!db.teams.some(x=>x.id===ui.setup.a))ui.setup.a=db.teams[0]?.id||'';if(!ui.setup.b||!db.teams.some(x=>x.id===ui.setup.b)||ui.setup.a===ui.setup.b)ui.setup.b=db.teams.find(x=>x.id!==ui.setup.a)?.id||'';for(const s of ['a','b']){const t=db.teams.find(x=>x.id===ui.setup[s]);if(t){const values=Object.values(ui.setup.lineups[s]||{});if(values.some(id=>!t.players.some(p=>p.id===id))||values.length!==6)ui.setup.lineups[s]=initialLineup(t)}}}
function setupPage(){ensureSetup();const setMode=ui.editingMatchSet,match=current();return `${title(setMode?'Новая партия: проверь обе шестёрки':'Подготовка нового матча')}<div class="setupSteps"><span class="active">1. Команды</span><span class="active">2. Расстановки</span><span class="active">3. Первая подача</span></div><section class="card"><div class="grid2">${['a','b'].map(s=>{const t=setMode?match.sides[s]:db.teams.find(x=>x.id===ui.setup[s]);return `<div class="teamSelectCard"><label class="label">${s==='a'?'Команда А':'Команда Б'}</label>${setMode?`<h3>${esc(t.name)}</h3>`:`<select class="field" data-setup-team="${s}">${db.teams.map(x=>`<option value="${x.id}" ${ui.setup[s]===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`}<div class="small muted mt8">${t?`${t.players.length} игроков · ${t.system}`:'Сначала создай команду'}</div><h3 class="mt18">Стартовая шестёрка</h3>${t?lineupEditor(t,s):'<div class="placeholder">Команда не выбрана</div>'}</div>`}).join('')}</div><div class="divider"></div>${setMode?current().sets.length+1===5?`<p class="notice warning">Пятая партия: укажи победителя новой жеребьёвки и первую подающую команду.</p>`:`<p class="notice">Первой будет подавать команда, которая не подавала первой в прошлой партии. Расстановки подтверждаются заново.</p>`:`<h3>Кто выиграл право первой подачи?</h3>`}<div class="flex mt12">${['a','b'].map(s=>`<label class="btn ${ui.setup.first===s?'navy':''}"><input name="first-server" type="radio" value="${s}" ${ui.setup.first===s?'checked':''} style="accent-color:#ff6b30">${esc((setMode?match.sides[s]:db.teams.find(x=>x.id===ui.setup[s]))?.name||s)}</label>`).join('')}</div><div class="flex mt18"><button class="btn primary" data-start-match>${setMode?'Начать следующую партию':'Начать матч → ⚡ LIVE'}</button><button class="btn" data-nav="teams">Вернуться к командам</button></div></section>`}
function lineupEditor(t,s){const players=t.players.filter(p=>p.role!=='Либеро');const map=ui.setup.lineups[s]||{};return `<div class="selectionGrid mt8">${ORDER.map(z=>`<div class="miniZone"><label>Зона ${z}</label><select class="field slim" data-lineup-side="${s}" data-lineup-zone="${z}"><option value="">Выбери</option>${players.map(p=>`<option value="${p.id}" ${map[z]===p.id?'selected':''}>${esc(p.number)} · ${esc(p.name||'Без имени')} · ${ROLESHORT[p.role]}</option>`).join('')}</select></div>`).join('')}</div><div class="small muted mt8">На площадке: 6 · либеро и запасные остаются в заявке. Подаёт игрок в зоне 1.</div>`}
function setDefaultAction(m,clear=true){if(clear){ui.target=null;ui.recipient=null}ui.side=m.serving;ui.skill='serve';ui.player=C.serverId(m);ui.subtype='Планер'}
function badge(s){return `<span class="tag">${esc(s)}</span>`}
function scoreBar(m){const sc=C.getScore(m),sum=C.matchesSummary(m);const side=(s)=>`<div class="teamScore ${s==='b'?'right':''}">${s==='b'?`<div class="scoreNumber num">${sc[s]}</div>`:''}<div><div class="teamname">${esc(m.sides[s].name)}</div><div class="sub">${m.serving===s?'<i class="serveDot"></i>Подаёт №'+esc(player(m,s,C.serverId(m))?.number||'?'):'На приёме'} · сеты ${sum.sets[s]}</div></div>${s==='a'?`<div class="scoreNumber num">${sc[s]}</div>`:''}</div>`;return `<section class="scorebar"><div class="scoreMain">${side('a')}<div class="text-center"><div class="small" style="color:#b8d2df">ПАРТИЯ ${m.setIndex+1}</div><div style="font-size:20px;font-weight:900">:</div></div>${side('b')}</div><div class="scoreActions"><button class="pointPlus" data-score="a">+1 ${esc(m.sides.a.name)}</button><button class="pointMinus" data-minus-score="a">−1</button><button class="pointPlus" data-score="b">+1 ${esc(m.sides.b.name)}</button><button class="pointMinus" data-minus-score="b">−1</button><button data-undo-contact>↶ Касание</button><button data-undo-rally>↶ Розыгрыш</button>${C.currentSet(m).status==='finished'?'<button data-next-set style="background:#e8ed7c;color:#162e40">Следующая партия →</button>':''}</div><div class="small" style="color:#d2e4f4;margin-top:8px;text-align:center">−1 исправляет только цифру на табло. Для отмены последнего очка вместе с переходом используй «↶ Розыгрыш».</div></section>`}
function coords(m,side,id){let p=m.positions[side]?.[id];if(!p){const z=C.zoneOfPlayer(m,side,id);p={x:z==='4'||z==='5'?.18:z==='3'||z==='6'?.5:.82,y:z==='4'||z==='3'||z==='2'?.24:.76}}return{left:p.x*100,top:(side==='a'?(1-p.y)*50:p.y*50+50)}}
function courtPage(m){let html=`<section class="card courtCard"><div class="cardhead"><div><h3>Площадка · игроки и перемещения</h3><div class="small muted">Выбери игрока, затем действие. Коснись свободного участка — отметишь направление мяча.</div></div><button class="btn tiny ${ui.move?'navy':''}" data-move-toggle>${ui.move?'Готово ✓':'⇄ Двигать игроков'}</button></div><div class="courtWrap"><div class="courtBoard" id="courtBoard" aria-label="Игровая площадка"><div class="half away"></div><div class="half home"></div><div class="attackline top"></div><div class="attackline bottom"></div><div class="courtNet"></div>${['a','b'].map((sd,idx)=>[['4','3','2'],['5','6','1']].map((row,r)=>row.map((z,c)=>`<span class="courtOverlayLabel" style="left:${(c+.5)*100/3}%;top:${(idx?50:0)+(r+.5)*25}%">${z}</span>`).join('')).join('')).join('')}<div class="courtCenterLabel top"><span>${esc(m.sides.a.name)}</span><span>3 м</span></div><div class="courtCenterLabel bottom"><span>${esc(m.sides.b.name)}</span><span>3 м</span></div>`;
 for(const side of ['a','b'])for(const z of ORDER){const pid=C.activeId(m,side,z);if(!pid)continue;const p=player(m,side,pid),pt=coords(m,side,pid),isSetter=p.role==='Связующий',isLib=p.role==='Либеро';html+=`<button type="button" class="courtPlayer ${isSetter?'setter':''} ${isLib?'lib':''} ${ui.side===side&&ui.player===pid?'selected':''}" data-actor="${pid}" data-side="${side}" style="left:${pt.left}%;top:${pt.top}%;background:${colorOf(m,side,pid)}" aria-label="${esc(p.name)} номер ${esc(p.number)}, ${esc(p.role)}"><span class="pnum">${esc(p.number)}</span><span class="prole">${ROLESHORT[p.role]||'?'}</span></button>`}
 const tracers=(m.current.events||[]).slice(-5);if(ui.showLines&&tracers.length){const toScreen=(p,side)=>({x:100*p.x,y:(side==='a'?(1-p.y)*.5:(1+p.y)*.5)*100});let paths='';for(const e of tracers){if(e.origin&&e.target){const start=toScreen(e.origin,e.side),to=toScreen(e.target,['serve','attack'].includes(e.skill)?C.opposite(e.side):e.side);paths+=`<line x1="${start.x}" y1="${start.y}" x2="${to.x}" y2="${to.y}" stroke="#dd3e57" stroke-width=".8" stroke-dasharray="1.8 1.2" marker-end="url(#arr)"/>`}}html+=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#dd3e57"/></marker></defs>${paths}</svg>`}
 if(ui.target){const pt=ui.target;html+=`<span class="targetDot" style="left:${pt.x*100}%;top:${(pt.side==='a'?(1-pt.y)/2:(1+pt.y)/2)*100}%"></span>`}html+=`</div><div class="flex mt8"><button class="btn tiny" data-toggle-lines>${ui.showLines?'Скрыть траектории':'Показать траектории'}</button><span class="small muted">Касания по площадке необязательны: зону можно выбрать справа.</span></div><div class="courtLegend"><span><i class="legendBubble" style="background:#12d3e0"></i>Связующий — бирюзовая рамка</span><span><i class="legendBubble" style="background:${m.sides.a.colors.libero}"></i>Либеро — отдельный цвет</span><span>Ц — центральный · Д — доигровщик · Дг — диагональный</span></div><div class="small muted mt8">${ui.move?'Режим перемещений: выбери игрока и коснись нового места на его половине площадки. Позиция запомнится для следующего касания.':'Схема на момент текущего розыгрыша. Номер зоны остаётся ротационным, даже после выхода игрока к сетке.'}</div></div></section>`;return html}
function quickZones(){const zones=['4','3','2','7','8','9','5','6','1','Стык 3-4','Стык 2-3','Стык 4-7','Стык 3-8','Стык 2-9','Стык 7-8','Стык 8-9','Стык 5-6','Стык 1-6'];
 return `<div class="mt12"><div class="between"><b>Куда направлен мяч?</b><button class="btn tiny" data-clear-zone>Не указывать</button></div><p class="small muted">Нажми зону или стык. Рисовать линию необязательно.</p><div class="zonepicker">${zones.map(z=>`<button class="zonebtn ${ui.selectedZone===z?'selected':''}" data-zone="${esc(z)}">${esc(z)}</button>`).join('')}</div><div class="miniNote">${ui.selectedZone?'Выбрано: '+esc(ui.selectedZone):'Зона не выбрана'} · точные X/Y появятся только при касании площадки.</div></div>`
}
function quickControls(m){const actor=player(m,ui.side,ui.player),pName=actor?`№${actor.number} ${actor.name}`:'Выбери игрока';const list=ORDER.map(z=>{const id=C.activeId(m,ui.side,z),p=player(m,ui.side,id);if(!p)return'';return `<button class="playerChip ${ui.player===id?'active':''}" data-actor="${id}" data-side="${ui.side}"><span class="number">№${esc(p.number)}</span><span>${esc(p.name)}</span><span class="muted">${ROLESHORT[p.role]}</span></button>`}).join('');return `<section class="card"><div class="between mb8"><h3>Быстрый ввод</h3>${badge(C.currentSet(m).rallies.length+1+'-й розыгрыш')}</div><div class="seg mb8">${['a','b'].map(s=>`<button class="${ui.side===s?'active':''}" data-live-side="${s}">${esc(m.sides[s].name)}</button>`).join('')}</div><div class="compactList">${list}</div><div class="notice mt12"><b>Игрок:</b> ${esc(pName)} · <b>${SKILLS[ui.skill]}</b>${ui.selectedZone?' · направление '+esc(ui.selectedZone):ui.target?' · направление '+esc(ui.target.zone):''}</div><h3 class="mt12 mb8">Что произошло?</h3><div class="actionGrid">${Object.entries(SKILLS).map(([k,v])=>`<button class="actionBtn ${ui.skill===k?'active':''}" data-skill="${k}">${v}</button>`).join('')}</div>${extraControls(m)}${quickZones()}<h3 class="mt12 mb8">Оцени действие одним нажатием</h3><div class="ratingGrid">${C.QUALITY.map(q=>`<button class="rating ${q==='++'?'strong':''} ${q==='='?'miss':''}" data-quality="${q}">${q}<small>${q==='++'?'Отлично':q==='+'?'Хорошо':q==='-'?'Плохо':q==='/'?'В игре':'Ошибка'}</small></button>`).join('')}</div><div class="small muted mt8">`+'++'+` = выигрышное действие для подачи/атаки/блока; = = ошибка и очко другой команде в однозначных случаях. Прочие оценки сохраняют розыгрыш в игре.</div><div class="flex mt12"><button class="btn tonal tiny" data-no-target>Без точки направления</button><button class="btn tiny" data-action-video>📹 Видео</button><button class="btn tiny" data-open-subs>Замены / либеро</button></div></section>`}
function extraControls(m){const types=TYPES[ui.skill]||[];let extras='';if(ui.skill==='serve')extras+=`<label class="mt12" style="display:block"><span class="label">Откуда подавал?</span><select class="field" data-serve-origin>${['Подача 5','Подача стык 5–6','Подача 6','Подача стык 1–6','Подача 1'].map(t=>`<option ${ui.serveOrigin===t?'selected':''}>${t}</option>`).join('')}</select></label>`;if(types.length)extras+=`<label class="mt12" style="display:block"><span class="label">${ui.skill==='set'?'Тип передачи':ui.skill==='attack'?'Тип атаки':ui.skill==='block'?'Участники блока':'Тип подачи'}</span><select class="field" data-subtype>${types.map(t=>`<option ${ui.subtype===t?'selected':''}>${t}</option>`).join('')}</select></label>`;if(ui.skill==='set'){extras+=`<label class="mt12" style="display:block"><span class="label">Комбинация</span><select class="field" data-combo>${COMBOS.map(t=>`<option ${ui.combo===t?'selected':''}>${t}</option>`).join('')}</select></label><div class="label mt12">Кому передача?</div><div class="recipientChips">${ORDER.map(z=>{const id=C.activeId(m,ui.side,z),p=player(m,ui.side,id);return p?`<button class="${ui.recipient===id?'active':''}" data-recipient="${id}">№${esc(p.number)} ${esc(p.name)}</button>`:''}).join('')}</div>`}return extras}
function allEditable(m){return C.currentSet(m).rallies.flatMap(r=>r.events.map(e=>({e,rally:r}))).concat((m.current?.events||[]).map(e=>({e,rally:null}))).reverse()}
function editForm(m){const d=ui.editContact;if(!d)return '';const found=allEditable(m).find(x=>x.e.id===d.id);if(!found)return '';const e=found.e;const roster=m.sides[e.side].players;const active=Object.values(e.lineups?.[e.side]||{}).filter(x=>x!==e.libero?.[e.side]?.replaced).concat(e.libero?.[e.side]?.id||[]);const skill=d.skill;return `<div class="editForm"><div class="between mb8"><b>✎ Исправить касание</b><button class="btn tiny" data-cancel-edit>Закрыть</button></div><div class="small muted mb8">${esc(m.sides[e.side].name)} · розыгрыш ${found.rally?found.rally.number:'текущий'} · редактируется только выбранное касание</div><div class="editGrid"><label><span class="label">Игрок</span><select class="field slim" data-edit-field="playerId">${roster.filter(p=>active.includes(p.id)||p.id===d.playerId).map(p=>`<option value="${p.id}" ${p.id===d.playerId?'selected':''}>№${esc(p.number)} ${esc(p.name)}</option>`).join('')}</select></label><label><span class="label">Действие</span><select class="field slim" data-edit-field="skill">${Object.entries(SKILLS).map(([k,t])=>`<option value="${k}" ${k===skill?'selected':''}>${t}</option>`).join('')}</select></label><label><span class="label">Оценка</span><select class="field slim" data-edit-field="quality">${C.QUALITY.map(q=>`<option value="${q}" ${q===d.quality?'selected':''}>${q} ${QUALITY_DESC[q]}</option>`).join('')}</select></label><label><span class="label">Вид действия</span><select class="field slim" data-edit-field="subtype"><option value="">—</option>${(TYPES[skill]||[]).map(t=>`<option value="${esc(t)}" ${t===d.subtype?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label><span class="label">Зона или стык</span><select class="field slim" data-edit-field="targetZone"><option value="">Не указана</option>${['4','3','2','7','8','9','5','6','1','Стык 3-4','Стык 2-3','Стык 4-7','Стык 3-8','Стык 2-9','Стык 7-8','Стык 8-9','Стык 5-6','Стык 1-6'].map(t=>`<option value="${t}" ${t===d.targetZone?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="small muted mt8">Изменение статистики в завершённом розыгрыше не пересчитывает автоматически его победителя. Исправление счёта — отдельная операция.</div><div class="flex mt12"><button class="btn primary" data-save-edit>Сохранить изменение</button><button class="btn" data-cancel-edit>Отмена</button></div></div>`}
function recent(m){const arr=allEditable(m).slice(0,12);return `<section class="card"><div class="between mb8"><h3>Последние действия</h3>${badge('автосохранение ✓')}</div><div class="eventList">${arr.length?arr.map(({e,rally})=>`<div class="evRow"><span class="small muted">${e.videoSeconds==null?'LIVE':fmtTime(e.videoSeconds)}</span><div><b>${esc(m.sides[e.side].name)} · ${esc(playerText(m,e.side,e.playerId))}</b><div class="muted small">${SKILLS[e.skill]} ${e.subtype?'· '+esc(e.subtype):''} ${e.targetZone?'· '+esc(e.targetZone):''} ${e.editedAt?'· исправлено':''}</div></div><div class="flex"><span class="evMark">${esc(e.quality)}</span><button class="btn tiny" data-edit-contact="${e.id}">✎</button></div></div>`).join(''):'<div class="placeholder">Пока нет действий. Выбери подающего и нажми оценку его подачи.</div>'}</div>${editForm(m)}</section>`}
function startEdit(id){const m=current(),found=allEditable(m).find(x=>x.e.id===id);if(!found)return;const e=found.e;ui.editContact={id,skill:e.skill,playerId:e.playerId,quality:e.quality,subtype:e.subtype||'',targetZone:e.targetZone||''};render()}
function saveEdit(){const m=current(),d=ui.editContact;if(!m||!d)return;const found=allEditable(m).find(x=>x.e.id===d.id);if(!found)return;const e=found.e;const alive=Object.values(e.lineups?.[e.side]||{}).filter(x=>x!==e.libero?.[e.side]?.replaced).concat(e.libero?.[e.side]?.id||[]);if(!alive.includes(d.playerId))throw Error('Этот игрок не находился на площадке в момент касания');if(!C.QUALITY.includes(d.quality))throw Error('Неизвестная оценка');Object.assign(e,{skill:d.skill,playerId:d.playerId,quality:d.quality,subtype:d.subtype,targetZone:d.targetZone,target:e.targetZone===d.targetZone?e.target:null,editedAt:Date.now()});ui.editContact=null;save();render();msg('Одно касание исправлено. Счёт оставлен без изменений.')}

function subsPanel(m){const s=ui.side,pool=m.sides[s].players.filter(p=>p.role!=='Либеро'&&!Object.values(m.lineups[s]).includes(p.id));const libs=m.sides[s].players.filter(p=>p.role==='Либеро');return `<section class="card" id="subsPanel"><div class="between"><h3>Замены · ${esc(m.sides[s].name)}</h3><button class="btn tiny" data-hide-subs>Закрыть</button></div><div class="grid2 mt12"><label><span class="label">Игрок на площадке</span><select class="field" id="sub-out">${ORDER.map(z=>`<option value="${m.lineups[s][z]}">Зона ${z}: ${esc(playerText(m,s,m.lineups[s][z]))}</option>`).join('')}</select></label><label><span class="label">Запасной</span><select class="field" id="sub-in">${pool.map(p=>`<option value="${p.id}">№${esc(p.number)} ${esc(p.name)}</option>`).join('')||'<option value="">Нет запасных</option>'}</select></label></div><div class="flex mt12"><button class="btn navy" data-do-sub>Выполнить замену</button><span class="small muted">Обычная замена отдельно от либеро</span></div><div class="divider"></div><h3>Либеро</h3><p class="small muted mt8">Базовый автоматический выход вместо центрального в задней линии. Нестандартные замены тренер подтверждает.</p><div class="flex mt12">${libs.map(l=>`<button class="btn tiny ${m.libero[s]?.id===l.id?'navy':''}" data-deploy-lib="${l.id}">${m.libero[s]?'Сменить на':'Выпустить'} №${esc(l.number)}</button>`).join('')}<button class="btn tiny danger" data-return-lib>Вернуть центрального</button></div><div class="small muted mt8">На площадке: ${m.libero[s]?esc(playerText(m,s,m.libero[s].id))+' · зона '+m.libero[s].zone:'либеро нет'}</div></section>`}
function livePage(){const m=current();if(!m)return home();if(C.currentSet(m).status==='finished'){const s=C.matchesSummary(m);return `${scoreBar(m)}<div class="card mt12 notice">Партия завершена. Счёт партий ${s.sets.a}:${s.sets.b}. Проверь новые шестёрки перед следующей.</div><div class="flex mt18"><button class="btn primary" data-next-set>Подготовить следующую партию</button><button class="btn" data-nav="analysis">Посмотреть анализ</button></div>`}return `${scoreBar(m)}<div class="liveGrid"><div class="column">${courtPage(m)}${ui.showVideo?videoView():''}${recent(m)}</div><div class="column">${quickControls(m)}${ui.showSubs?subsPanel(m):''}<section class="card noPrint"><div class="between"><div><h3>Разбор матча</h3><p class="muted small">Карты, статистика игроков, распределение связующего</p></div><button class="btn tonal" data-nav="analysis">Открыть →</button></div></section></div></div>`}
function mapSVG(m,side,action){const all=C.events(m).filter(e=>e.skill===action&&e.side===side&&(ui.analysisSet===0||e.set===ui.analysisSet)&&(e.target||e.targetZone));const exact=all.filter(e=>e.target),zoneOnly=all.filter(e=>!e.target&&e.targetZone);const sectors=[['4','3','2'],['7','8','9'],['5','6','1']];const counts={};for(const e of all)if(e.targetZone)counts[e.targetZone]=(counts[e.targetZone]||0)+1;let inner='';for(let i=1;i<3;i++){inner+=`<span class="mapline h" style="top:${i*100/3}%"></span><span class="mapline v" style="left:${i*100/3}%"></span>`}for(let row=0;row<3;row++)for(let col=0;col<3;col++){const label=sectors[row][col];inner+=`<span class="mapSector" style="left:${(col+.5)*100/3}%;top:${(row+.5)*100/3}%">${label}${counts[label]?`<span class="mapZoneCount">${counts[label]}</span>`:''}</span>`}for(const e of exact){const x=e.target.x*100,y=e.target.y*100,c=e.quality==='++'?'point':e.quality==='='?'error':'other';inner+=`<span class="mapDot ${c}" title="${esc(playerText(m,side,e.playerId))} · ${esc(e.quality)} · ${esc(e.targetZone)}" style="left:${x}%;top:${y}%"></span>`}return `<div class="mapBoard">${inner}</div><div class="small muted mt8">Точных точек: ${exact.length} · действий только с выбранной зоной: ${zoneOnly.length}. Цифры в ячейках — количество попаданий в сектор. Место попадания не выдумывается, если координаты неизвестны.</div>`}
function analysisPage(){const m=current();if(!m)return `<div class="card"><h2>Выбери матч для анализа</h2>${matchesList()}</div>`;const s=ui.mapSide,d=C.stats(m,s,ui.analysisSet||null),setDist=C.setters(m,s,ui.analysisSet||null);let es=C.events(m).filter(e=>e.side===s&&(ui.analysisSet===0||e.set===ui.analysisSet));let zones={};for(const e of es)if(e.targetZone)zones[e.targetZone]=(zones[e.targetZone]||0)+1;return `<div class="between mb8"><div><h2>Аналитика · ${esc(m.title)}</h2><p class="muted small">Сохранённые касания и направления · разбор по команде и игроку</p></div><div class="flex"><button class="btn tiny" data-nav="live">← LIVE</button><button class="btn tiny" data-export-png>PNG</button><button class="btn tiny" data-print>PDF / печать</button><button class="btn tiny" data-export-json>Резервная копия</button><label class="btn tiny">Импорт JSON<input type="file" accept="application/json,.json" data-import-json hidden></label></div></div><section class="card"><div class="flex"><div><span class="label">Команда</span><select class="field slim" data-analysis-side>${['a','b'].map(x=>`<option value="${x}" ${s===x?'selected':''}>${esc(m.sides[x].name)}</option>`).join('')}</select></div><div><span class="label">Партия</span><select class="field slim" data-analysis-set><option value="0">Все партии</option>${m.sets.map((x,i)=>`<option value="${i+1}" ${ui.analysisSet===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div></div></section><div class="grid3 mt12"><div class="summaryStat"><div class="muted small">Эффективность атаки</div><div class="val">${safePercent(d.attackPoints-d.attackErrors,d.attackAttempts)}</div><div class="small muted">${d.attackPoints} очков / ${d.attackErrors} ошибок / ${d.attackAttempts} попыток</div></div><div class="summaryStat"><div class="muted small">Позитивный приём</div><div class="val">${safePercent(d.receivePositive,d.receiveTotal)}</div><div class="small muted">${d.receivePositive} положительных из ${d.receiveTotal}</div></div><div class="summaryStat"><div class="muted small">Подача · эйсы / ошибки</div><div class="val">${d.serveAces} / ${d.serveErrors}</div><div class="small muted">Всего ${d.total} отмеченных действий</div></div></div><section class="card mt12"><h3>Карты направлений</h3><div class="reportMaps mt12"><div><div class="between mb8"><b>Атака</b><span class="small muted">Зоны 4–3–2 / 7–8–9 / 5–6–1</span></div>${mapSVG(m,s,'attack')}</div><div><div class="between mb8"><b>Подача</b><span class="small muted">Точки приземления</span></div>${mapSVG(m,s,'serve')}</div></div><div class="small muted mt12"><b>Откуда подавали:</b> ${Object.entries(C.events(m).filter(e=>e.side===s&&e.skill==='serve'&&e.originZone).reduce((a,e)=>(a[e.originZone]=(a[e.originZone]||0)+1,a),{})).map(([z,n])=>esc(z)+' · '+n).join(' · ')||'пока нет данных'}</div><p class="small muted mt12">Стыки: 3–4, 2–3, 4–7, 3–8, 2–9, 7–8, 8–9, 5–6, 1–6. Система распознаёт их по близости к границе секторов.</p><div class="flex mt12">${Object.entries(zones).sort((a,b)=>b[1]-a[1]).slice(0,14).map(([z,n])=>`<span class="tag">${esc(z)} · ${n}</span>`).join('')}</div></section><div class="grid2 mt12"><section class="card"><h3>Индивидуальная статистика</h3><div style="overflow:auto"><table class="reportTable mt12"><thead><tr><th>Игрок</th><th>Подача</th><th>Эйсы</th><th>Атака</th><th>Очки</th><th>Ош.</th><th>Приём +</th><th>Блок</th></tr></thead><tbody>${d.players.map(p=>`<tr><td><b>№${esc(p.player.number)}</b> ${esc(p.player.name)}</td><td>${p.serve}</td><td>${p.aces}</td><td>${p.attacks}</td><td>${p.kills}</td><td>${p.attackErrors}</td><td>${p.positiveReceives}/${p.receives}</td><td>${p.blocks}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h3>Кому чаще пасует связующий</h3>${setDist.length?setDist.map(x=>`<div class="mt12"><div class="between"><span>№${esc(x.player?.number||'?')} ${esc(x.player?.name||'')}</span><b>${x.count} · ${x.pct}%</b></div><div class="bar mt8"><i style="width:${x.pct}%"></i></div></div>`).join(''):'<div class="placeholder mt12">Пока нет передач с указанным получателем. В LIVE-режиме при выборе «Передача» указывай, кому пасует связующий.</div>'}</section></div>`}

function exportFile(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function goSetup(setMode=false){ui.editingMatchSet=setMode;if(setMode){const m=current();ui.setup.lineups={a:C.clone(m.lineups.a),b:C.clone(m.lineups.b)};ui.setup.first=C.opposite(C.currentSet(m).firstServer)}else{ui.setup.lineups={a:{},b:{}};ui.setup.first='a'}ui.view='setup';render()}
function appendRating(q){const m=current();if(!m)return;if(!ui.player){msg('Сначала выбери игрока на площадке');return}let v=$('#live-video');const from=m.positions[ui.side]?.[ui.player]||null;const data={side:ui.side,playerId:ui.player,skill:ui.skill,quality:q,subtype:ui.subtype||TYPES[ui.skill]?.[0]||'',combination:ui.combo,originZone:ui.skill==='serve'?ui.serveOrigin:'',recipientId:ui.skill==='set'?ui.recipient:null,origin:from?{x:from.x,y:from.y}:null,target:ui.target?{x:ui.target.x,y:ui.target.y}:null,targetZone:ui.selectedZone||ui.target?.zone||'',videoSeconds:v?v.currentTime:null};try{const e=C.appendContact(m,data);const winner=C.terminal(e);if(winner){C.completeRally(m,winner,'auto:'+ui.skill+':'+q);msg('Очко '+teamName(m,winner)+' · подача и расстановка обновлены');setDefaultAction(m)}else{const next={serve:['receive',C.opposite(ui.side)],receive:['set',ui.side],set:['attack',ui.side],attack:['dig',C.opposite(ui.side)],dig:['set',ui.side],block:['dig',C.opposite(ui.side)]}[ui.skill];ui.skill=next[0];ui.side=next[1];ui.player=next[0]==='serve'?C.serverId(m):ORDER.map(z=>C.activeId(m,ui.side,z)).find(x=>player(m,ui.side,x)?.role==='Связующий'&&next[0]==='set')||C.activeId(m,ui.side,'6');ui.subtype=(TYPES[ui.skill]||[])[0]||'';ui.recipient=null;ui.target=null;ui.selectedZone=''}save();render()}catch(err){msg(err.message)}}
function moveOrTarget(m,clientX,clientY,board){const box=board.getBoundingClientRect();const x=Math.min(.99,Math.max(.01,(clientX-box.left)/box.width)),y=Math.min(.99,Math.max(.01,(clientY-box.top)/box.height));const side=y<.5?'a':'b';const localY=side==='a'?(1-y*2):(y-.5)*2;const distance=localY; if(ui.move){if(!ui.movePlayer){msg('Выбери игрока, которого нужно переместить');return}if(ui.movePlayer.side!==side){msg('Перемещай игрока внутри его половины площадки');return}const z=C.zoneOfPlayer(m,side,ui.movePlayer.id);m.positions[side][ui.movePlayer.id]={x,y:localY,zone:z};ui.movePlayer=null;save();render();return}if(['serve','attack'].includes(ui.skill)&&side===ui.side){msg('Для подачи и атаки отмечай точку на половине соперника');return}if(ui.skill==='set'&&side!==ui.side){msg('Передача связующего — на свою половину');return}ui.target={side,x,y:distance,zone:C.analyticsZone({x,y:distance},ui.skill)};ui.selectedZone=ui.target.zone;msg('Направление: '+ui.target.zone+' · нажми оценку');render()}

function saveTeam(){const d=ui.teamDraft;const e=C.rosterError(d);if(e){msg(e);return}if(ui.editingId){const i=db.teams.findIndex(t=>t.id===ui.editingId);if(i>=0)db.teams[i]={...d,id:ui.editingId}}else db.teams.push({...d,id:C.uuid()});ui.teamDraft=null;ui.editingId=null;save();render();msg('Команда сохранена и доступна для следующих матчей')}
function startMatch(){try{const {a,b,lineups,first}=ui.setup;let m;if(ui.editingMatchSet){m=current();C.nextSet(m,first,lineups.a,lineups.b)}else{const t1=db.teams.find(t=>t.id===a),t2=db.teams.find(t=>t.id===b);if(!t1||!t2||a===b)throw Error('Выбери две разные команды');m=C.createMatch(t1,t2,lineups.a,lineups.b,first);db.matches.push(m);db.activeId=m.id}ui.editingMatchSet=false;setDefaultAction(m);ui.view='live';save();render()}catch(e){msg(e.message)}}
function doTerminal(winner){const m=current();if(!m)return;try{C.completeRally(m,winner,'manual');setDefaultAction(m);save();render();msg('Розыгрыш завершён. Расстановка и подача обновлены.')}catch(e){msg(e.message)}}
function reportPng(){const m=current();if(!m)return;let side=ui.mapSide,s=C.stats(m,side,ui.analysisSet||null),c=document.createElement('canvas');c.width=1240;c.height=680;let g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#18334b';g.fillRect(0,0,1240,105);g.fillStyle='#fff';g.font='bold 36px Arial';g.fillText('ПИТЕРСКИЙ СКАУТ · АНАЛИТИКА',43,60);g.fillStyle='#172d43';g.font='bold 25px Arial';g.fillText(m.sides[side].name+' · '+m.title,42,153);g.font='20px Arial';g.fillText('Эффективность атаки: '+safePercent(s.attackPoints-s.attackErrors,s.attackAttempts),43,208);g.fillText('Позитивный приём: '+safePercent(s.receivePositive,s.receiveTotal),43,250);g.fillText('Эйсы: '+s.serveAces+' · ошибки подачи: '+s.serveErrors,43,292);for(const [index,skill] of ['attack','serve'].entries()){const xx=45+index*440,yy=344,w=325,h=287;g.fillStyle='#e8c6a1';g.fillRect(xx,yy,w,h);g.strokeStyle='#fff';for(let k=1;k<3;k++){g.beginPath();g.moveTo(xx+k*w/3,yy);g.lineTo(xx+k*w/3,yy+h);g.stroke();g.beginPath();g.moveTo(xx,yy+k*h/3);g.lineTo(xx+w,yy+k*h/3);g.stroke()}for(const e of C.events(m).filter(e=>e.side===side&&e.skill===skill&&e.target)){g.beginPath();g.arc(xx+e.target.x*w,yy+e.target.y*h,6,0,Math.PI*2);g.fillStyle=e.quality==='++'?'#239a63':e.quality==='='?'#ee4a4a':'#278cc9';g.fill();g.strokeStyle='white';g.stroke()}g.fillStyle='#192f44';g.font='bold 19px Arial';g.fillText(skill==='attack'?'АТАКИ':'ПОДАЧИ',xx+10,yy-12)}g.fillStyle='#59697c';g.font='17px Arial';g.fillText('Показатели рассчитаны по отмеченным тренером событиям.',47,667);c.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Питерский_Скаут_отчет.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png')}
function applyAction(el){const m=current(),d=el.dataset;if(d.nav){if(d.nav==='setup')goSetup(false);else nav(d.nav);return}if(d.createTeam!==undefined){createTeam();return}if(d.cancelTeam!==undefined){ui.teamDraft=null;ui.view='teams';render();return}if(d.editTeam){ui.editingId=d.editTeam;ui.teamDraft=C.clone(db.teams.find(t=>t.id===d.editTeam));ui.view='teams';render();return}if(d.addTeamPlayer!==undefined){ui.teamDraft.players.push({id:C.uuid(),number:'',name:'',role:'Доигровщик'});render();return}if(d.removeTeamPlayer){ui.teamDraft.players=ui.teamDraft.players.filter(p=>p.id!==d.removeTeamPlayer);render();return}if(d.saveTeam!==undefined){saveTeam();return}if(d.openMatch){db.activeId=d.openMatch;setDefaultAction(current());ui.view='live';save();render();return}if(d.startMatch!==undefined){startMatch();return}if(d.nextSet!==undefined){goSetup(true);return}if(!m)return;
if(d.actor){ui.side=d.side;ui.player=d.actor;if(ui.move){ui.movePlayer={side:d.side,id:d.actor};msg('Теперь коснись нового места на площадке')}render();return}
if(d.liveSide){ui.side=d.liveSide;ui.player=C.activeId(m,ui.side,'1');ui.target=null;render();return}
if(d.skill){ui.skill=d.skill;ui.target=null;ui.selectedZone='';ui.subtype=(TYPES[ui.skill]||[])[0]||'';ui.recipient=null;if(d.skill==='serve'){ui.side=m.serving;ui.player=C.serverId(m)}render();return}
if(d.recipient){ui.recipient=d.recipient;render();return}
if(d.quality){appendRating(d.quality);return}
if(d.moveToggle!==undefined){ui.move=!ui.move;ui.movePlayer=null;render();return}
if(d.noTarget!==undefined){ui.target=null;ui.selectedZone='';render();return}if(d.zone!==undefined){ui.selectedZone=d.zone;ui.target=null;render();return}if(d.clearZone!==undefined){ui.selectedZone='';ui.target=null;render();return}if(d.toggleLines!==undefined){ui.showLines=!ui.showLines;render();return}
if(d.actionVideo!==undefined){ui.showVideo=!ui.showVideo;render();return}
if(d.openSubs!==undefined){ui.showSubs=!ui.showSubs;render();return}
if(d.hideSubs!==undefined){ui.showSubs=false;render();return}
if(d.deployLib){try{const s=ui.side,zone=['1','6','5'].find(z=>!(m.serving===s&&z==='1')&&C.playerById(m,s,m.lineups[s][z])?.role==='Центральный');if(m.current?.events?.length)throw Error('Замены либеро выполняются между розыгрышами');if(m.libero[s])C.switchLibero(m,s,d.deployLib);else{if(!zone)throw Error('Нет свободного центрального на задней линии');C.replaceLibero(m,s,d.deployLib,zone)}save();render()}catch(e){msg(e.message)}return}
if(d.returnLib!==undefined){if(m.current?.events?.length){msg('Возврат либеро возможен между розыгрышами');return}C.releaseLibero(m,ui.side);save();render();return}
if(d.doSub!==undefined){try{const out=$('#sub-out').value,inc=$('#sub-in').value;C.sub(m,ui.side,out,inc);save();render();msg('Замена записана')}catch(e){msg(e.message)}return}
if(d.score){doTerminal(d.score);return}if(d.minusScore){try{C.correctScore(m,d.minusScore,-1);save();render();msg('−1 к табло. При необходимости исправь подачу и расстановку отдельно.')}catch(e){msg(e.message)}return}if(d.editContact){startEdit(d.editContact);return}if(d.cancelEdit!==undefined){ui.editContact=null;render();return}if(d.saveEdit!==undefined){try{saveEdit()}catch(e){msg(e.message)}return}
if(d.undoContact!==undefined){C.undoContact(m);save();render();msg('Последнее касание отменено');return}
if(d.undoRally!==undefined){C.undoRally(m);setDefaultAction(m);save();render();msg('Последний розыгрыш отменён: счёт и позиции восстановлены');return}
if(d.exportJson!==undefined){exportFile('Питерский_Скаут_резервная_копия.json',JSON.stringify(db,null,2));return}
if(d.exportPng!==undefined){reportPng();return}
if(d.print!==undefined){window.print();return}
if(d.videoJump){let v=$('#live-video');if(v)v.currentTime=Math.max(0,v.currentTime+Number(d.videoJump));return}
if(d.videoSlow!==undefined){let v=$('#live-video');if(v)v.playbackRate=v.playbackRate===.5?1:.5;return}}
function applyChange(el){let d=el.dataset;if(d.tfield){ui.teamDraft[d.tfield]=el.value;return}if(d.color){ui.teamDraft.colors[d.color]=el.value;return}if(d.playerField){const p=ui.teamDraft?.players.find(x=>x.id===d.playerId);if(p)p[d.playerField]=el.value;return}if(d.setupTeam){ui.setup[d.setupTeam]=el.value;ui.setup.lineups[d.setupTeam]={};render();return}if(d.lineupSide){ui.setup.lineups[d.lineupSide][d.lineupZone]=el.value;return}if(el.name==='first-server'){ui.setup.first=el.value;return}if(d.subtype!==undefined){ui.subtype=el.value;return}if(d.serveOrigin!==undefined){ui.serveOrigin=el.value;return}if(d.combo!==undefined){ui.combo=el.value;return}if(d.analysisSide){ui.mapSide=el.value;render();return}if(d.analysisSet){ui.analysisSet=Number(el.value);render();return}if(d.editField&&ui.editContact){ui.editContact[d.editField]=el.value;if(d.editField==='skill')ui.editContact.subtype='';render();return}if(el.matches('[data-import-json]')&&el.files?.[0]){el.files[0].text().then(raw=>{try{const obj=JSON.parse(raw);if(!Array.isArray(obj.teams)||!Array.isArray(obj.matches))throw Error('Это не резервная копия Питерского Скаута');if(!confirm('Заменить локальные данные сохранённой резервной копией?'))return;db=obj;ui.teamDraft=null;ui.view=db.activeId?'live':'home';if(current())setDefaultAction(current());save();render();msg('Резервная копия восстановлена')}catch(e){msg(e.message)}});return} if(el.id==='video-file'&&el.files?.[0]){if(ui.videoUrl)URL.revokeObjectURL(ui.videoUrl);ui.videoUrl=URL.createObjectURL(el.files[0]);ui.videoName=el.files[0].name;ui.showVideo=true;render();return}}
function install(){document.addEventListener('click',e=>{const el=e.target.closest('button[data-nav],button[data-create-team],button[data-cancel-team],button[data-edit-team],button[data-add-team-player],button[data-remove-team-player],button[data-save-team],button[data-open-match],button[data-start-match],button[data-next-set],button[data-actor],button[data-live-side],button[data-skill],button[data-recipient],button[data-quality],button[data-move-toggle],button[data-no-target],button[data-action-video],button[data-open-subs],button[data-hide-subs],button[data-deploy-lib],button[data-return-lib],button[data-do-sub],button[data-score],button[data-minus-score],button[data-edit-contact],button[data-cancel-edit],button[data-save-edit],button[data-zone],button[data-clear-zone],button[data-toggle-lines],button[data-undo-contact],button[data-undo-rally],button[data-export-json],button[data-export-png],button[data-print],button[data-video-jump],button[data-video-slow]');if(el){e.preventDefault();applyAction(el);return}const board=e.target.closest('#courtBoard');if(board&&current())moveOrTarget(current(),e.clientX,e.clientY,board)});document.addEventListener('change',e=>applyChange(e.target));document.addEventListener('input',e=>{const el=e.target;if(el.dataset.tfield||el.dataset.color||el.dataset.playerField)applyChange(el)});document.addEventListener('keydown',e=>{if(ui.view!=='live'||!current()||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;const ids=['serve','receive','set','attack','block','dig'];if(/^[1-6]$/.test(e.key)){e.preventDefault();ui.skill=ids[Number(e.key)-1];ui.subtype=(TYPES[ui.skill]||[])[0]||'';render()}if(['0','+','-'].includes(e.key)){e.preventDefault();appendRating(e.key==='0'?'=':e.key==='+'?'+':'-')}if(e.key==='Backspace'){e.preventDefault();C.undoContact(current());save();render()}if(e.key===' '&&$('#live-video')){e.preventDefault();let v=$('#live-video');v.paused?v.play():v.pause()}});window.addEventListener('beforeunload',()=>save());if(!db.teams.length&&!db.matches.length)ui.view='home';else if(db.activeId)ui.view='live';else ui.view='teams';if(current())setDefaultAction(current());render()}
install();window.ScoutTest={C,db,ui,render,save,setDefaultAction,appendRating};
