function demoEpisode(m){let rally=m.events.filter(e=>e.rally===1);return `<div class="split"><div class="panel"><div class="between"><h3>Розыгрыш №1 · пример</h3><span class="pill green">Выигранное очко</span></div><div class="hintbox">Три действия: принял → пас связующего → атака. Нажми «Показать мяч» и посмотри путь.</div><div id="animation-stage" class="courtholder">${courtSVG({m,trace:[rally[0]?.origin,rally[0]?.target,rally[1]?.target,rally[2]?.target],clickLabel:'Схема движения мяча в учебном эпизоде'})}</div><div class="flex mt"><button class="btn primary" data-action="play" data-val="1">▶ Показать движение мяча</button><button class="btn secondary" data-action="stop-play">■ Остановить</button></div><p class="court-helper">Анимация показывает уже записанные касания; она не распознаёт видео автоматически.</p></div><div class="panel"><h3>Что происходило?</h3><div class="timeline">${rally.map((e,i)=>`<div class="entry"><div><b>${i+1}. ${skillLabel(e.action)} · ${esc(playerName(m,e.playerId))}</b><br><small>${e.action==='set'?'Кому: '+esc(playerName(m,e.recipientId)):e.action==='attack'?'Мяч попал в площадку соперника':e.action==='receive'?'Хороший приём':'Действие'} · ${timecode(e.videoTime)}</small></div><span class="pill ${e.result==='point'?'green':''}">${e.result==='point'?'Очко':'В игре'}</span></div>`).join('')}</div><div class="surface-note mt"><b>А почему это важно?</b><br>Тренер видит не только куда прилетела атака, но и путь мяча: кто принял, кому связующий отдал пас, кто завершил розыгрыш. Можно отдельно изучать передачи после хорошего или выбитого приёма.</div><div class="flex mt"><button class="btn" data-action="demo-tab" data-val="practice">Теперь попробую сам →</button><button class="btn ghost" data-action="demo-tab" data-val="map">Смотреть карты</button></div></div></div>`}

function inputFlow(m,isPractice=false){let d=ui.draft;const config=SPORTS[m.sport];let step=ui.coachStep;const currentStages=['skill','player',...(d.action==='set'?['recipient','passtarget']:(d.action==='serve'?['target']:['origin',...(skillIsTarget(d.action)?['target']:[])])), 'result'];

 let q=step==='skill'?'Что произошло с мячом?':step==='player'?'Кто выполнил действие?':step==='recipient'?'Кому отдали пас?':step==='passtarget'?'Куда связующий направил мяч?':step==='origin'?'Где игрок коснулся мяча?':step==='target'?(d.action==='serve'?'Куда прилетела подача?':'Куда полетел мяч?'):'Как завершилось действие?';

 if(step==='skill'){html+=`<div class="choices">${config.skills.map(([k,l])=>`<button class="choice" data-action="skill" data-val="${k}">${esc(l)} <small>${k==='set'?'Кому пасует связующий':k==='attack'?'Можно и с задней линии':k==='serve'?'Куда подал':k==='receive'?'Где принял': 'Отмечаем касание'}</small></button>`).join('')}</div>`}
 else if(step==='player'||step==='recipient'){const pool=step==='recipient'?m.players.filter(p=>p.id!==d.playerId&&onCourt(m).includes(p.id)):availableActors(m,d.action);html+=`<div class="choices">${pool.map(p=>`<button class="choice" data-action="${step==='recipient'?'recipient':'player'}" data-val="${esc(p.id)}">№${esc(p.number)} <small>${esc(p.name)}</small></button>`).join('')}</div>`;if(!pool.length)html+='<p class="surface-note warn">На площадке нет доступного спортсмена. Проверь состав и шестёрку.</p>';if(step==='recipient')html+='<p class="tiny muted">Выбираешь получателя, затем отмечаешь точку передачи на своей площадке (необязательно).</p>'}
 else if(step==='origin'||step==='target'||step==='passtarget'){

 }

 if(step!=='skill'&&step!=='result')html+=`<div class="flex mt"><button class="btn ghost small" data-action="back">← Назад</button><button class="btn ghost small" data-action="restart">Начать заново</button></div>`;

function selectedList(m){return m.events.filter(e=>e.side!=='them'&&(ui.filters.player==='all'||e.playerId===ui.filters.player)&&(ui.filters.set==='all'||String(e.set)===ui.filters.set))}
function mapPage(m,isDemo=false){let skills=['indoor','beach'].includes(m.sport)?[['attack','Атаки'],['serve','Подачи'],['set','Передачи'],['receive','Приём']]:SPORTS[m.sport].skills;let chosen=skills.find(x=>x[0]===ui.mapAction);if(!chosen)ui.mapAction=skills[0][0];let e=selectedList(m).filter(x=>x.action===ui.mapAction);let side=ui.mapSide;if(ui.mapAction==='receive'||ui.mapAction==='dig'||ui.mapAction==='block')side='origin';let valid=e.filter(x=>side==='both'?(x.origin&&x.target):x[side]);let missing=e.length-valid.length;const pct=e.length?Math.round(e.filter(x=>x.result==='point').length/e.length*100):0;
 return `<div class="split"><div class="panel"><div class="between"><div><h3>Карта · ${esc(ACTION_NAMES[ui.mapAction]||chosen?.[1])}</h3><p class="muted tiny">${e.length} действий, ${valid.length} точек показано. Каждая точка — одно действие.</p></div><span class="pill green">${pct}% завершились очком</span></div><div class="tabs">${skills.map(([k,l])=>`<button data-action="map-skill" data-val="${k}" class="${ui.mapAction===k?'active':''}">${esc(l)}</button>`).join('')}</div><div class="flex mb no-print">${ui.mapAction!=='serve'&&ui.mapAction!=='set'?`<button class="btn ${side==='origin'?'primary':'ghost'} small" data-action="side" data-val="origin">Откуда</button>`:''}<button class="btn ${side==='target'?'primary':'ghost'} small" data-action="side" data-val="target">Куда</button>${ui.mapAction==='attack'||(['forehand','backhand','smash'].includes(ui.mapAction))?`<button class="btn ${side==='both'?'primary':'ghost'} small" data-action="side" data-val="both">↗ Траектории</button>`:''}</div><div class="courtholder">${courtSVG({m,events:valid,which:side==='both'?'target':side,paths:side==='both',clickLabel:'Карта действий: каждая точка соответствует игровому событию'})}</div><p class="court-helper">🟢 Очко · 🔵 В игре · 🔴 Ошибка. Нажми на точку и увидишь игрока.</p>${missing?`<div class="surface-note mt">${missing} событий без координат для этого режима. Ошибки «аут / сетка» не получают выдуманную точку.</div>`:''}</div><div class="panel"><h3>Выбери, что посмотреть</h3><div class="formrow"><label><span class="fieldlabel">Игрок</span><select class="field" id="filter-player"><option value="all">Все игроки</option>${m.players.map(p=>`<option value="${p.id}" ${ui.filters.player===p.id?'selected':''}>№${esc(p.number)} ${esc(p.name)}</option>`).join('')}</select></label><label><span class="fieldlabel">Партия / сет</span><select class="field" id="filter-set"><option value="all">Все</option>${[1,2,3,4,5].map(i=>`<option value="${i}" ${ui.filters.set===String(i)?'selected':''}>${i}</option>`).join('')}</select></label></div><div class="grid3 mt"><div class="stat"><strong>${e.length}</strong><small>Действий</small></div><div class="stat"><strong>${e.filter(x=>x.result==='point').length}</strong><small>Очков</small></div><div class="stat"><strong>${e.filter(x=>x.result==='error').length}</strong><small>Ошибок</small></div></div>${ui.picked?(()=>{let x=e.find(z=>z.id===ui.picked);return x?`<div class="surface-note success mt"><b>${esc(skillLabel(x.action))} · ${esc(playerName(m,x.playerId))}</b><br>${x.recipientId?'Кому: '+esc(playerName(m,x.recipientId))+' · ':''}${x.result==='point'?'Очко':x.result==='error'?'Ошибка':'В игре'} · ${timecode(x.videoTime)}</div>`:''})():`<p class="muted tiny mt">Нажми на точку на карте для деталей.</p>`}<h3 class="mt">Последние записи</h3><div class="timeline">${e.slice(-6).reverse().map(x=>`<div class="entry"><div><b>${esc(playerName(m,x.playerId))}</b><br><small>${skillLabel(x.action)} · розыгрыш ${x.rally} · ${timecode(x.videoTime)}</small></div><span class="pill ${x.result==='point'?'green':x.result==='error'?'red':''}">${x.result==='point'?'Очко':x.result==='error'?'Ошибка':'В игре'}</span></div>`).join('')||'<div class="empty">Пока нет записанных действий</div>'}</div></div></div>`}
function setterPage(m){let passes=selectedList(m).filter(e=>e.action==='set'&&e.recipientId&&(ui.filters.quality==='all'||(e.quality||'Не указано')===ui.filters.quality)&&(ui.filters.rotation==='all'||String(e.rotationNo||'')===ui.filters.rotation));let total=passes.length;let by={};passes.forEach(e=>{by[e.recipientId]=(by[e.recipientId]||0)+1});return `<div class="panel"><div class="between"><div><h2>Кому чаще отдают передачи?</h2><p class="muted">Каждый пас с указанным получателем попадает в статистику. Учитываются передачи и из передней, и из задней части площадки.</p></div><span class="pill">${total} передач</span></div><div class="formrow"><label><span class="fieldlabel">Чьи передачи</span><select id="filter-player" class="field"><option value="all">Все передающие</option>${m.players.filter(p=>passes.some(e=>e.playerId===p.id)||p.role==='Связующий').map(p=>`<option value="${p.id}" ${ui.filters.player===p.id?'selected':''}>${esc(playerName(m,p.id))}</option>`).join('')}</select></label><label><span class="fieldlabel">Партия</span><select id="filter-set" class="field"><option value="all">Все</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${ui.filters.set===String(n)?'selected':''}>${n}</option>`).join('')}</select></label><label><span class="fieldlabel">Расстановка</span><select id="filter-rotation" class="field"><option value="all">Любая P1–P6</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${ui.filters.rotation===String(n)?'selected':''}>P${n}</option>`).join('')}</select></label></div><label style="display:block;max-width:320px;margin-top:12px"><span class="fieldlabel">После какого приёма</span><select id="filter-quality" class="field">${[['all','Все'],['Идеальный','Идеальный'],['Хороший','Хороший'],['Выбитый','Выбитый'],['Не указано','Не указано']].map(([k,l])=>`<option value="${k}" ${ui.filters.quality===k?'selected':''}>${l}</option>`).join('')}</select></label><div class="mt">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([pid,n])=>`<div class="srow"><div><div class="between"><b>${esc(playerName(m,pid))}</b><small>${n} · ${Math.round(n/(total||1)*100)}%</small></div><div class="chartbar"><span style="width:${n/(total||1)*100}%"></span></div></div><b>${n}</b></div>`).join('')||'<div class="empty">Запиши хотя бы одну передачу с получателем, чтобы увидеть распределение.</div>'}</div><div class="grid2 mt"><div><h3>Куда направлены передачи</h3><div class="courtholder">${courtSVG({m,events:passes.filter(x=>x.target),which:'target'})}</div><p class="tiny muted">Только реальные точки, которые тренер отметил.</p></div><div class="surface-note">${passes.filter(x=>x.target).length} из ${total} передач имеют координаты. Кому отдаётся пас, известно и без координат. Для профессионального отчёта по P1–P6 дополнительно потребуется проверять положение связующего относительно расстановки.</div></div></div>`}
function accountPage(){return `<div class="crumb"><button data-action="home">Главная</button> / Мой кабинет</div><div class="panel" style="max-width:590px;margin:auto"><div class="eyebrow">ПОСЛЕ ДЕМО</div><h1>Теперь попробуем твой матч</h1><p class="lead">Для локального теста достаточно указать имя тренера. Это <b>не настоящая регистрация</b>: пароля, синхронизации или сервера аккаунтов здесь нет.</p><form id="profile-form"><label class="fieldlabel" for="coach-name">Как к тебе обращаться?</label><input class="field" id="coach-name" name="name" required minlength="2" placeholder="Например, Тренер команды" value="${esc(state.profile?.name||'')}"><button class="btn primary mt block" type="submit">Продолжить к созданию матча →</button></form><p class="tiny muted">Данные хранятся только в браузере. Для переноса используй резервную копию JSON.</p></div>`}
function wizardPage(){const s=SPORTS[ui.sport];return `<div class="crumb"><button data-action="home">Главная</button> / Создать матч / Шаг ${ui.wizardStep} из 3</div><div class="between"><div><div class="eyebrow">НОВЫЙ МАТЧ</div><h1>${ui.wizardStep===1?'1. Что за матч?':ui.wizardStep===2?'2. Кто играет?':'3. Кто выходит на площадку?'}</h1><p class="muted">${ui.wizardStep===1?'Назови команды — это единственные обязательные данные на этом шаге.':ui.wizardStep===2?'Добавь весь состав: не только тех, кто выходит в начале.':'Выставляем стартовую шестёрку. Остальные — запасные.'}</p></div><span class="pill green">${s.icon} ${s.short}</span></div>${ui.wizardStep===1?`<div class="panel" style="max-width:750px"><div class="formrow"><label><span class="fieldlabel">Вид спорта</span><select class="field" id="wizard-sport">${Object.entries(SPORTS).map(([k,v])=>`<option value="${k}" ${ui.sport===k?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label><label><span class="fieldlabel">Дата</span><input class="field" type="date" id="wizard-date" value="${ui.newDate}"></label><label><span class="fieldlabel">Наша команда</span><input class="field" id="wizard-team" placeholder="Например, Рубеж" value="${esc(ui.newTeam)}"></label><label><span class="fieldlabel">Соперник</span><input class="field" id="wizard-opponent" placeholder="Например, Команда Б" value="${esc(ui.newOpponent)}"></label></div><div class="flex mt"><button class="btn primary" data-action="wizard-next">Далее: состав →</button></div></div>`:ui.wizardStep===2?`<div class="panel"><div class="between"><h3>Заявка команды · ${ui.newPlayers.length} игроков</h3><button class="btn secondary small" data-action="add-player">+ Добавить игрока</button></div><p class="surface-note">${s.hint} Номера и фамилии можно изменить. На площадке будет только ${s.places}, но ${ui.sport==='indoor'?'в списке могут быть запасные и до двух либеро.':'мы добавляем игроков под текущий формат.'}</p><div class="mt">${rosterEditor(ui.newPlayers,s)}</div><div class="flex mt"><button class="btn ghost" data-action="wizard-back">← Назад</button><button class="btn primary" data-action="wizard-next">${ui.sport==='indoor'?'Далее: шестёрка →':'Создать матч →'}</button></div></div>`:`<div class="panel"><div class="surface-note">Выбери шесть разных спортсменов, которые начнут матч. Либеро будет назначен отдельно, чтобы не вытеснять игрока из заявки.</div><div class="positions mt">${POS_ORDER.map(p=>`<div class="position"><label for="starter-${p}">${POSITION_LABELS[p]}</label><select class="field" id="starter-${p}" data-starter="${p}"><option value="">— Выбрать —</option>${ui.newPlayers.filter(x=>x.role!=='Либеро').map(x=>`<option value="${x.id}" ${ui.newLineup[p]===x.id?'selected':''}>№${esc(x.number)} ${esc(x.name)}</option>`).join('')}</select></div>`).join('')}</div><p class="surface-note mt">Либеро выйдет позже через кнопку «Выпустить либеро» на экране состава. Так видно, кого именно он заменяет на задней линии.</p><div class="flex mt"><button class="btn ghost" data-action="wizard-back">← К составу</button><button class="btn primary" data-action="wizard-next">Создать пустой матч →</button></div></div>`}`}
function rosterEditor(players,s){return `<div class="tiny muted" style="margin-bottom:7px">№ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Фамилия / имя &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Роль</div>${players.map((p,i)=>`<div class="rosteritem" data-player-row="${p.id}"><input class="field" aria-label="Номер игрока" data-roster-field="number" data-id="${p.id}" value="${esc(p.number)}"><input class="field" aria-label="Имя игрока" data-roster-field="name" data-id="${p.id}" value="${esc(p.name)}" placeholder="Фамилия"><select class="field" aria-label="Амплуа" data-roster-field="role" data-id="${p.id}">${s.roles.map(role=>`<option value="${role}" ${p.role===role?'selected':''}>${role}</option>`).join('')}</select><button class="ghostx" title="Удалить из заявки" data-action="remove-player" data-val="${p.id}">×</button></div>`).join('')||'<div class="empty">Пока ни одного игрока. Нажми «Добавить игрока».</div>'}`}
function rosterManage(m){return `<div class="grid2"><div class="panel"><div class="between"><h3>Заявка · ${m.players.length}</h3><button class="btn secondary small" data-action="match-add-player">+ Игрок</button></div><p class="tiny muted">На площадке шесть. В списке ниже могут быть запасные, которых легко выпустить на замену.</p>${rosterEditor(m.players,SPORTS[m.sport])}<div class="surface-note mt">Изменения фамилий и номеров сохраняются сразу после ввода. Игровые действия привязаны к внутреннему ID игрока, а не к номеру формы.</div></div><div class="panel"><h3>На площадке сейчас</h3>${m.sport==='indoor'?`${courtSVG({m,showLineup:true})}<div class="flex mt"><span class="pill">Переход по выигранной чужой подаче — автоматически</span><button class="btn ghost small" data-action="restore-libero" ${!m.libero?'disabled':''}>Вернуть заменённого либеро игрока</button></div><div class="surface-note mt">При выигранной чужой подаче приложение выполняет переход само и учитывает его в истории розыгрыша. Если либеро был на площадке, он возвращается перед переходом. Полный контроль правил замен ещё в разработке.</div><div class="subtle"></div><h3>Обычная замена</h3><div class="formrow"><label><span class="fieldlabel">Кого заменяем (зона)</span><select class="field" id="sub-zone">${POS_ORDER.map(p=>`<option value="${p}">Зона ${p}: ${esc(playerName(m,m.lineup?.[p]))}</option>`).join('')}</select></label><label><span class="fieldlabel">Кто выходит</span><select class="field" id="sub-player"><option value="">Выбери запасного</option>${m.players.filter(p=>p.role!=='Либеро'&&!inSix(m).includes(p.id)).map(p=>`<option value="${p.id}">${esc(playerName(m,p.id))}</option>`).join('')}</select></label></div><button class="btn primary small mt" data-action="substitute">↔ Сделать замену</button><div class="subtle"></div><h3>Либеро · только задняя линия</h3><div class="formrow"><label><span class="fieldlabel">Какой либеро выйдет</span><select id="libero-player" class="field"><option value="">Выбери либеро</option>${m.players.filter(p=>p.role==='Либеро').map(p=>`<option value="${p.id}">${esc(playerName(m,p.id))}</option>`).join('')}</select></label><label><span class="fieldlabel">Кого заменяет на задней линии</span><select id="libero-zone" class="field">${BACK.map(p=>`<option value="${p}">Зона ${p} · ${esc(playerName(m,m.lineup?.[p]))}</option>`).join('')}</select></label></div><button class="btn primary small mt" data-action="deploy-libero" ${m.libero?'disabled':''}>Выпустить либеро</button>${m.libero?`<div class="surface-note success mt">Либеро на площадке в зоне ${m.libero.position}, вместо ${esc(playerName(m,m.libero.replaced))}. Одновременно второго либеро выпустить нельзя.</div>`:''}<div class="subtle"></div><h3>Схема стартовой шестёрки</h3><div class="positions">${POS_ORDER.map(p=>`<div class="position"><label>Зона ${p}</label><select class="field" data-lineup-edit="${p}">${m.players.filter(pl=>pl.role!=='Либеро').map(pl=>`<option value="${pl.id}" ${m.lineup?.[p]===pl.id?'selected':''}>№${esc(pl.number)} ${esc(pl.name)}</option>`).join('')}</select></div>`).join('')}</div>`:`<div class="surface-note mt">${m.sport==='beach'?'Два игрока: либеро и замены не предусмотрены.':'Для выбранного спорта шестёрка и либеро не применяются.'}</div>`}</div></div>`}
function videoBlock(){return `<div class="panel no-print"><div class="between"><div><h3>Видео матча <span class="pill">необязательно</span></h3><p class="muted tiny">Видео остаётся на устройстве. Время касания записывается при сохранении.</p></div><label class="btn secondary small filebtn">📼 Выбрать видео <input id="video-file" type="file" accept="video/*"></label></div>${ui.videoUrl?`<div class="videoarea"><video id="match-video" class="video" src="${ui.videoUrl}" controls playsinline preload="metadata"></video><div class="flex mt"><button class="btn secondary small" data-action="video-back">⟲ −5 сек</button><button class="btn secondary small" data-action="video-play">⏯ Пауза / пуск</button><button class="btn secondary small" data-action="video-forward">+5 сек ⟳</button><button class="btn ghost small" data-action="video-slow">0,5× скорость</button></div><p class="tiny muted">Пробел — пауза; ← и → — перемотка 5 секунд. Ввод действия сохраняет текущую секунду видео.</p><p class="tiny muted">${esc(ui.videoName||'')} · После перезагрузки видео нужно выбрать повторно.</p></div>`:''}</div>`}

 (async()=>{for(let i=0;i<chain.length;i++){if(run!==ui.playId)break;let c=chain[i];label.textContent=`${i+1}/${chain.length} · ${skillLabel(c.action)} · ${playerName(m,c.playerId)}`;await frame(800,c.start,c.end);await new Promise(res=>setTimeout(res,200))}if(run===ui.playId){label.textContent='Розыгрыш завершён. Анимация отражает сохранённые точки касаний.';ball.style.display='none'}})()}
function chooseAction(btn){const act=btn.dataset.action, val=btn.dataset.val;
 if(act&&act.startsWith('tac-')){tacHandle(act,val,ui.screen==='demo'?DEMOS[ui.sport]:current(),btn);return}
 switch(act){
 case'home':show('home');break;
 case'demo':ui.mapAction='attack';ui.filters={player:'all',set:'all',quality:'all',rotation:'all'};ui.reportDemo=true;startDemo(btn.dataset.sport||ui.sport);break;
 case'demo-tab':ui.demoTab=val;if(val==='practice')stageReset();render();break;
 case'create':ui.reportDemo=false;startNew(btn.dataset.sport||ui.sport);break;
 case'history':show(state.profile?'history':'account');break;
 case'back-work':show('work');break;
 case'demo-home':show('demo');break;
 case'work-tab':ui.workTab=val;ui.picked=null;render();break;
 case'play':playRally(Number(val));break;
 case'stop-play':ui.playId++;document.getElementById('animation-ball')?.setAttribute('style','display:none');break;
 case'skill':selectSkill(val);break;
 case'player':selectActor(val);break;
 case'recipient':selectRecipient(val);break;
 case'outcome':ui.draft.result=val;render();break;
 case'save':saveAction();break;
 case'again':case'restart':stageReset();render();break;
 case'back':draftBack();break;
 case'no-target':ui.draft.target=null;ui.draft.result='error';ui.coachStep='result';render();break;
 case'skip-pass-target':ui.draft.target=null;ui.coachStep='result';render();break;
 case'skip-origin':ui.draft.origin=null;ui.coachStep=skillIsTarget(ui.draft.action)?'target':'result';render();break;
 case'open-match':{const m=state.matches.find(x=>x.id===val);if(!m)return;state.selected=m.id;ui.sport=m.sport;ui.workTab=['indoor','beach'].includes(m.sport)?'tactics':'input';ui.videoUrl=null;ui.videoTime=0;stageReset();persist();show('work');break}
 case'open-report':goReport(false);break;
 case'report-demo':goReport(true);break;
 case'report-png':pngReport();break;
 case'print':window.print();break;
 case'backup':exportJSON();break;
 case'wizard-back':ui.wizardStep=Math.max(1,ui.wizardStep-1);render();break;
 case'wizard-next':nextWizard();break;
 case'add-player':addPlayer(true);break;
 case'match-add-player':addPlayer(false);break;
 case'remove-player':removePlayer(val,ui.screen==='wizard');break;
 case'substitute':substitute(current());break;
 case'deploy-libero':deployLibero(current());break;
 case'restore-libero':returnLibero(current());break;
 case'rotate':rotate(current());break;
 case'map-skill':ui.mapAction=val;ui.mapSide='target';ui.picked=null;render();break;
 case'side':ui.mapSide=val;ui.picked=null;render();break;
 case'set-server':{let m=current();if(m){if(m.events.some(e=>e.rally===m.rallyNo)){toast('Нельзя менять подающую команду после записи касаний');break}RALLY.setServer(m,val);persist();render()}break}
  case'end-rally':endRally(val);break;
  case'video-back':case'video-forward':case'video-play':case'video-slow':{let v=document.getElementById('match-video');if(!v)break;if(act==='video-back')v.currentTime=Math.max(0,v.currentTime-5);if(act==='video-forward')v.currentTime=Math.min(v.duration||Infinity,v.currentTime+5);if(act==='video-play'){v.paused?v.play().catch(()=>{}):v.pause()}if(act==='video-slow'){v.playbackRate=v.playbackRate===0.5?1:0.5;toast('Скорость видео: '+v.playbackRate+'×')}break}
 case'seek-video':{let video=document.getElementById('match-video');if(video){video.currentTime=Number(val)||0;video.play().catch(()=>{})}break}
 case'undo-rally':{let m=current();if(m?.rallies.length&&confirm('Отменить последний розыгрыш и восстановить подачу / расстановку?')){try{RALLY.undoRally(m);persist();render()}catch(err){toast(err.message)}}break}
 case'redo-rally':{let m=current();if(m?.redoRallies?.length){try{RALLY.redoRally(m);persist();render()}catch(err){toast(err.message)}}break} case'undo-event':{let m=current();if(m){try{undoLastEvent(m)}catch(err){toast(err.message)}}break} case'redo-event':{let m=current();if(m){try{redoLastEvent(m)}catch(err){toast(err.message)}}break} case'delete-event':{let m=current();if(m&&confirm('Удалить эту запись?')){m.events=m.events.filter(x=>x.id!==val);m.redoEvents=[];persist();render()}break}
 case'delete-match':{let m=state.matches.find(x=>x.id===val);if(m&&confirm('Удалить этот матч без возможности восстановления?')){state.matches=state.matches.filter(x=>x.id!==val);if(state.selected===val)state.selected=null;persist();render()}break}
 }
}
document.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(button){e.preventDefault();chooseAction(button);return}const point=e.target.closest('[data-event]');if(point){ui.picked=point.getAttribute('data-event');render();return}const tac=e.target.closest('svg[data-tactic-board]');if(tac){tacPoint(ui.screen==='demo'?DEMOS[ui.sport]:current(),e);return}const court=e.target.closest('svg[data-court-tap]');if(court)handleCourt(court,e)});
document.addEventListener('input',e=>{let el=e.target;if(el.id==='wizard-team')ui.newTeam=el.value;else if(el.id==='wizard-opponent')ui.newOpponent=el.value;else if(el.id==='wizard-date')ui.newDate=el.value;else if(el.dataset.rosterField){let p=(ui.screen==='wizard'?ui.newPlayers:current()?.players||[]).find(x=>x.id===el.dataset.id);if(p){p[el.dataset.rosterField]=el.value;if(ui.screen!=='wizard')persist()}}});
document.addEventListener('change',async e=>{let el=e.target;if(el.id==='wizard-sport'){ui.sport=el.value;ui.newPlayers=[];ui.newLineup={};render()}else if(el.dataset.starter){ui.newLineup[el.dataset.starter]=el.value}else if(el.id==='filter-player'){ui.filters.player=el.value;ui.picked=null;render()}else if(el.id==='filter-set'){ui.filters.set=el.value;ui.picked=null;render()}else if(el.id==='filter-quality'){ui.filters.quality=el.value;render()}else if(el.id==='filter-rotation'){ui.filters.rotation=el.value;render()}else if(el.id==='pass-quality'){ui.draft.quality=el.value}else if(el.dataset.lineupEdit){let m=current(),pos=el.dataset.lineupEdit,pid=el.value;if(m.libero){toast('Верни либеро перед изменением стартовой шестёрки');render();return}if(Object.entries(m.lineup).some(([zone,x])=>zone!==pos&&x===pid)){toast('Этот игрок уже стоит в другой зоне');render();return}if(!m.players.some(p=>p.id===pid&&p.role!=='Либеро')){toast('Нельзя поставить либеро в стартовую шестёрку');render();return}m.lineup[pos]=pid;persist();render()}else if(el.dataset.rosterField){let m=current();if(!m)return;let valid=checkRoster(m.players,m.sport);if(m.sport==='indoor'&&el.dataset.rosterField==='role'&&inSix(m).includes(el.dataset.id)&&m.players.find(p=>p.id===el.dataset.id)?.role==='Либеро'){m.players.find(p=>p.id===el.dataset.id).role='Универсальный';toast('Сначала убери игрока из шестёрки, потом назначай либеро');render();return}if(valid)toast(valid);persist()}else if(el.id==='video-file'){let file=el.files?.[0];if(!file)return;if(!file.type.startsWith('video/')&&!/\.(mp4|mov|m4v|webm)$/i.test(file.name)){toast('Выбери видеофайл');return}if(ui.videoUrl)URL.revokeObjectURL(ui.videoUrl);ui.videoUrl=URL.createObjectURL(file);ui.videoName=file.name;ui.videoTime=0;render();toast('Видео открыто только на твоём устройстве')}else if(el.id==='restore-file'){await importJSON(el.files?.[0]);el.value=''}});
document.addEventListener('keydown',e=>{if(ui.screen!=='work'||ui.workTab!=='input'||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;let v=document.getElementById('match-video');if(!v)return;if(e.code==='Space'){e.preventDefault();v.paused?v.play().catch(()=>{}):v.pause()}else if(e.key==='ArrowLeft'){e.preventDefault();v.currentTime=Math.max(0,v.currentTime-5)}else if(e.key==='ArrowRight'){e.preventDefault();v.currentTime=Math.min(v.duration||Infinity,v.currentTime+5)}});
document.addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();let name=(new FormData(e.target).get('name')||'').toString().trim();if(name.length<2){toast('Введи имя из двух или более символов');return}state.profile={name,local:true};persist();if(ui.newTeam||ui.newPlayers.length){show('wizard')}else startNew(ui.sport)}});
document.addEventListener('change',e=>{const el=e.target;if(!el.matches('[data-tac-field]'))return;const m=ui.screen==='demo'?DEMOS[ui.sport]:current();if(!m)return;tacTweak(m,el.dataset.tacField,el.value)});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-tac-field="opponentNo"]'))ui.tac.opponentNo=el.value});
document.addEventListener('pointerdown',tacDragStart);
document.addEventListener('pointerup',tacDragEnd);
window.PV_SCOUT_TEST={SPORTS,matchScore,validateLineup,checkRoster,DEMO:DEMOS,RALLY,TAC:{tacModel,tacActiveSetter,tacDemoEvents}};

render();
})();
</script></body></html>
