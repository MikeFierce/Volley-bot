name: Scout engine regression
on:
  push:
    paths:
      - 'scout-beta/rebuild/**'
      - '.github/workflows/scout-engine.yml'
  pull_request:
    paths:
      - 'scout-beta/rebuild/**'
      - '.github/workflows/scout-engine.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scout regression suite
        run: node --test scout-beta/rebuild/engine.test.js scout-beta/rebuild/match.test.js
